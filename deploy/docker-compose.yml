version: '3.8'

services:
  db:
    image: postgres:16
    container_name: hand-in-hand-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hand_in_hand}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hand_in_hand"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hand-in-hand-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:localdev@db:5432/hand_in_hand}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@kraski-detstva.ru}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: hand-in-hand-mailhog
    ports:
      - "1025:1025"
      - "9000:8025"

  nginx:
    image: nginx:1.27-alpine
    container_name: hand-in-hand-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
