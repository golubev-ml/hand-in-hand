services:
  db:
    image: postgres:16
    container_name: hand-in-hand-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hand_in_hand}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hand_in_hand}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hand-in-hand-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:localdev@db:5432/hand_in_hand}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-noreply@kraski-detstva.ru}
      # Основной домен: на него строятся returnUrl/failUrl для шлюза Сбера
      BASE_URL: ${BASE_URL:-https://hand-in-hand-kzn.ru}
      # HIH-9: контур шлюза. Бой — https://securepay.sberbank.ru/ecomm/gateway/api/rest/
      SBER_BASE_URL: ${SBER_BASE_URL:-https://ecomtest.sberbank.ru/ecomm/gateway/api/rest/}
      SBER_VERIFY_SSL: ${SBER_VERIFY_SSL:-true}
      # Учётные данные шлюза живут в БД (админка /admin/settings); env — только фолбэк
      SBER_USER_NAME: ${SBER_USER_NAME:-}
      SBER_PASSWORD: ${SBER_PASSWORD:-}
      SBER_MERCHANT_LOGIN: ${SBER_MERCHANT_LOGIN:-}
      SBER_KEY: ${SBER_KEY:-}
      SBER_TERMINAL: ${SBER_TERMINAL:-}
      SBER_KEY_ID: ${SBER_KEY_ID:-}
      SBER_PAYMENTS_ENABLED: ${SBER_PAYMENTS_ENABLED:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backup
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-deploy_web}"
      # API, админка и возвраты оплаты обслуживаются только доменом окружения.
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:-hand-in-hand-kzn.ru}`) && (PathPrefix(`/api`) || PathPrefix(`/payment`) || PathPrefix(`/admin`) || PathPrefix(`/uploads`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks: [internal, web]

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
    container_name: hand-in-hand-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-deploy_web}"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-hand-in-hand-kzn.ru}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.priority=50"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks: [web]

  # Лендинг доступен на отдельном поддомене только под префиксом /landing.
  landing:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.landing
    container_name: hand-in-hand-landing
    environment:
      SITE_URL: ${SITE_URL:-https://hand-in-hand-kzn.ru}
      SITE_HOST: ${SITE_HOST:-hand-in-hand-kzn.ru}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-deploy_web}"
      - "traefik.http.routers.landing.rule=Host(`${LANDING_DOMAIN:-hand.hand-in-hand-kzn.ru}`) && PathPrefix(`/landing`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing.priority=50"
      - "traefik.http.routers.landing.middlewares=landing-strip"
      - "traefik.http.middlewares.landing-strip.stripprefix.prefixes=/landing"
      - "traefik.http.services.landing.loadbalancer.server.port=80"
    networks: [web]

  mailhog:
    image: mailhog/mailhog
    container_name: hand-in-hand-mailhog
    ports:
      - "1025:1025"
      - "9000:8025"
    networks: [internal]

  # ВАЖНО: production Docker требует API >= 1.44. Не возвращать старые значения 1.24/1.40.
  traefik:
    image: traefik:v2.11
    container_name: hand-in-hand-traefik
    profiles: ["bundled-proxy"]
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=deploy_web"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-m2a2x2000@gmail.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [web]

  tests:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    environment:
      BASE_URL: ${BASE_URL:-https://hand-in-hand-kzn.ru}
      API_URL: http://api:8000
      MAILHOG_URL: http://mailhog:8025
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on: [api]
    networks: [internal, web]
    profiles: ["test"]

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  letsencrypt:

networks:
  internal:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-deploy_web}
